# LifeGoods nginx — hardened public edge.
# Serves the built SPA, reverse-proxies /api to the backend, terminates TLS,
# and blocks exposure of backend internals (schema/docs) to the public.
#
# Certificate paths are mounted into the container (see docker-compose.prod.yml).
# Real TLS material is provisioned by deploy.sh (Let's Encrypt via certbot).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Aggregate operational fields only: no IP, Barcode-bearing URL or referrer.
    log_format main '$request_method $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 32m;
    server_tokens off;

    # Security headers applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Full protection from open redirects / host header injection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # SSRF/origin constraints are enforced by the app; nginx stays lean.

    upstream lifegoods_backend {
        server backend:8000;
        keepalive 16;
    }

    # Plain HTTP -> redirect to HTTPS (only used by the let's-encrypt webroot previously).
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS site.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!eNULL;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        root /usr/share/nginx/html;
        index index.html;

        # Static SPA: always serve index.html for client routes (history mode).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-cache immutable hashed assets.
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Reverse proxy API to backend. Backend is only reachable through here.
        location /api/ {
            proxy_pass http://lifegoods_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Block public access to backend schema/docs (Swift/OpenAPI).
        location ~ ^/(scalar|openapi.json|docs|redoc) {
            return 404;
        }

        # Deny access to dotfiles.
        location ~ /\. {
            deny all;
        }
    }
}
