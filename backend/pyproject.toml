[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifegoods-backend"
version = "0.1.0"
description = "LifeGoods REST API"
requires-python = "==3.13.*"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx2>=2.0,<3",
  "Pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.14,<5",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "regex>=2026.7,<2027",
  "scalar-fastapi>=1.0.0,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "fakeredis>=2.27,<3",
  "mongomock>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: marks tests requiring real services (run with --run-integration or LIFEGOODS_TEST_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/lifegoods"]
